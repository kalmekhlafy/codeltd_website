<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CODE LTD — SaaS development company. Coming soon to codeltd.com.">
  <title>CODE LTD — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --orange:#E8522A; --amber:#FF7A3D; --gold:#FFB347; --red:#C42B0B; --bg:#060407; }
    html, body { background:var(--bg); color:#fff; font-family:'Inter',-apple-system,sans-serif; cursor:none; overflow:hidden; height:100%; }

    /* Custom cursor */
    .cursor { position:fixed; width:10px; height:10px; background:var(--orange); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); mix-blend-mode:screen; box-shadow:0 0 12px var(--orange),0 0 28px var(--amber); transition:transform .1s; }
    .cursor-ring { position:fixed; width:36px; height:36px; border:1px solid rgba(232,82,42,.35); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); }

    /* Canvas */
    #canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1; }
    .scanlines { position:fixed; inset:0; z-index:3; pointer-events:none; background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px); }
    .vignette { position:fixed; inset:0; z-index:4; pointer-events:none; background:radial-gradient(ellipse at center,transparent 35%,rgba(6,4,7,.5) 68%,rgba(6,4,7,.94) 100%); }

    /* Loader */
    #loader { position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2rem; }
    .ld-logo { width:240px; height:auto; image-rendering:pixelated; opacity:.9; }
    .ld-track { width:200px; height:1px; background:rgba(255,255,255,.07); }
    .ld-fill { height:100%; width:0%; background:linear-gradient(to right,var(--red),var(--orange),var(--amber)); box-shadow:0 0 10px var(--orange); }
    .ld-label { font-family:'JetBrains Mono',monospace; font-size:.62rem; letter-spacing:.22em; color:rgba(255,255,255,.22); }

    /* Nav */
    .nav { position:fixed; top:0; left:0; width:100%; padding:1.8rem 3rem; display:flex; align-items:center; justify-content:space-between; z-index:50; opacity:0; }
    .nav-logo img { height:26px; width:auto; image-rendering:pixelated; }
    .nav-logo-text { font-weight:900; letter-spacing:.3em; font-size:.85rem; color:var(--orange); }
    .nav-contact { font-size:.7rem; font-weight:400; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.35); text-decoration:none; transition:color .3s; }
    .nav-contact:hover { color:var(--amber); }

    /* Hero */
    #hero { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 2rem; pointer-events:none; }
    .hero-eyebrow { font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.5em; text-transform:uppercase; color:var(--amber); margin-bottom:2.4rem; opacity:0; }
    .hero-logo { width:min(460px,72vw); height:auto; image-rendering:pixelated; opacity:0; }
    .hero-logo-text { font-size:clamp(3.5rem,12vw,8rem); font-weight:900; letter-spacing:.08em; color:var(--orange); opacity:0; line-height:1; }
    .hero-tagline { font-size:clamp(.95rem,2.2vw,1.35rem); font-weight:200; letter-spacing:.1em; color:rgba(255,255,255,.4); margin-top:1.8rem; opacity:0; }
    .hero-tagline em { font-style:normal; color:var(--amber); font-weight:400; }
    .hero-sep { width:1px; height:52px; background:linear-gradient(to bottom,transparent,rgba(232,82,42,.45),transparent); margin:1.8rem auto; opacity:0; }

    /* Coming soon badge */
    .hero-badge { display:flex; align-items:center; gap:.75rem; opacity:0; margin-bottom:2.4rem; }
    .badge-dot { width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--orange),0 0 20px var(--amber); flex-shrink:0; animation:pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.7);opacity:.4} }
    .badge-text { font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.32em; text-transform:uppercase; color:rgba(255,255,255,.32); }

    /* Email form */
    .hero-form { display:flex; gap:0; width:min(420px,88vw); opacity:0; pointer-events:all; }
    .hero-input { flex:1; padding:.82rem 1.1rem; background:rgba(255,255,255,.05); border:1px solid rgba(232,82,42,.3); border-right:none; color:#fff; font-family:'Inter',sans-serif; font-size:.86rem; outline:none; border-radius:3px 0 0 3px; transition:border-color .3s; }
    .hero-input::placeholder { color:rgba(255,255,255,.2); }
    .hero-input:focus { border-color:var(--orange); }
    .hero-btn { padding:.82rem 1.6rem; background:var(--orange); border:1px solid var(--orange); color:#fff; font-family:'Inter',sans-serif; font-size:.8rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; border-radius:0 3px 3px 0; transition:background .25s,border-color .25s; white-space:nowrap; }
    .hero-btn:hover { background:var(--amber); border-color:var(--amber); }

    /* Bottom bar */
    .bottom { position:fixed; bottom:0; left:0; width:100%; padding:1.5rem 3rem; display:flex; align-items:center; justify-content:space-between; z-index:50; opacity:0; }
    .bottom span { font-family:'JetBrains Mono',monospace; font-size:.6rem; letter-spacing:.14em; color:rgba(255,255,255,.16); }
    .s-dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:#00ff88; margin-right:.45rem; box-shadow:0 0 6px #00ff88; animation:pulse 2s ease-in-out infinite; }

    @media(max-width:600px) {
      .nav { padding:1.2rem 1.5rem; }
      .bottom { padding:1rem 1.5rem; }
      .bottom .mid { display:none; }
      .hero-form { flex-direction:column; }
      .hero-input { border-right:1px solid rgba(232,82,42,.3); border-bottom:none; border-radius:3px 3px 0 0; }
      .hero-btn { border-radius:0 0 3px 3px; }
    }
  </style>
</head>
<body>

<div id="loader">
  <img class="ld-logo" src="https://savoxx.com/media/images/codeltd_logo.png" alt="CODE LTD"
       onerror="this.style.display='none';document.getElementById('ld-fb').style.display='block'">
  <div id="ld-fb" style="display:none;font-size:1.8rem;font-weight:900;letter-spacing:.3em;color:#E8522A">CODE LTD</div>
  <div class="ld-track"><div class="ld-fill" id="lf"></div></div>
  <div class="ld-label" id="ll">Loading…</div>
</div>

<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="curR"></div>
<canvas id="canvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<nav class="nav" id="nav">
  <div id="navLogo">
    <img src="https://savoxx.com/media/images/codeltd_logo.png" alt="CODE LTD"
         onerror="this.outerHTML='<span class=nav-logo-text>CODE LTD</span>'">
  </div>
  <a class="nav-contact" href="mailto:hello@codeltd.com">Contact</a>
</nav>

<section id="hero">
  <div class="hero-eyebrow" id="eyebrow">SaaS · Software Development · Innovation</div>

  <img class="hero-logo" id="heroLogo" src="https://savoxx.com/media/images/codeltd_logo.png" alt="CODE LTD"
       onerror="this.outerHTML='<div class=hero-logo-text id=heroLogo>CODE LTD</div>'">

  <div class="hero-tagline" id="tagline">
    Crafting <em>tomorrow's software</em>, shipped today
  </div>
  <div class="hero-sep" id="sep"></div>

  <div class="hero-badge" id="badge">
    <div class="badge-dot"></div>
    <span class="badge-text">Launching Soon — codeltd.com</span>
  </div>

  <form class="hero-form" id="heroForm" onsubmit="handleSubmit(event)">
    <input class="hero-input" type="email" placeholder="your@email.com" required>
    <button class="hero-btn" type="submit">Notify Me</button>
  </form>
</section>

<div class="bottom" id="bot">
  <span><span class="s-dot"></span>Systems Online</span>
  <span class="mid">© 2026 CODE LTD. All rights reserved.</span>
  <span>codeltd.com</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';

/* ── Background warm radial glow ── */
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`
    precision mediump float;
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec2 c=vUv-.5; c.x*=1.75;
      float d=length(c);
      float pulse=sin(uTime*.2)*.03+sin(uTime*.11+1.4)*.018;
      float r=.3+pulse;
      float core=smoothstep(r+.38,r-.05,d);
      float haze=smoothstep(.78,.0,d)*.18;
      vec3 col=mix(vec3(.012,.008,.02),vec3(.2,.05,.01),core+haze);
      col+=vec3(.15,.035,.008)*sin(d*13.-uTime*.35)*.013*(1.-d);
      gl_FragColor=vec4(col,1.);
    }
  `,
  depthWrite:false,
});
const bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(30,18), bgMat);
bgPlane.position.z = -4;

/* ── Film grain ── */
const filmShader = {
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    float rand(vec2 c){ return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      c.rgb+=(rand(vUv+uTime*.07)-.5)*.02;
      c.rgb*=smoothstep(.9,.14,length(vUv-.5)*.88);
      gl_FragColor=c;
    }
  `
};

/* ── Scene setup ── */
const canvas   = document.getElementById('canvas');
const scene    = new THREE.Scene();
const cam      = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 200);
cam.position.z = 5;

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

scene.add(bgPlane);

/* Stars */
const sp = new Float32Array(3500*3);
for(let i=0;i<3500;i++){
  const r=13+Math.random()*28, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
  sp[i*3]=r*Math.sin(ph)*Math.cos(th); sp[i*3+1]=r*Math.sin(ph)*Math.sin(th); sp[i*3+2]=r*Math.cos(ph);
}
const starGeo=new THREE.BufferGeometry(); starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xFFE4C8,size:.024,transparent:true,opacity:.48,sizeAttenuation:true}));
scene.add(stars);

/* Floating dust */
const dp = new Float32Array(1400*3);
for(let i=0;i<1400;i++){
  dp[i*3]=(Math.random()-.5)*22; dp[i*3+1]=(Math.random()-.5)*13; dp[i*3+2]=(Math.random()-.5)*10-1;
}
const dustGeo=new THREE.BufferGeometry(); dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dustGeo, new THREE.PointsMaterial({color:0xE8522A,size:.015,transparent:true,opacity:.26,sizeAttenuation:true}));
scene.add(dust);

/* Post-processing */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.45,.9));
const film=new ShaderPass(filmShader); composer.addPass(film);

/* Mouse tracking */
const cur=document.getElementById('cur'), curR=document.getElementById('curR');
const mouse={x:0,y:0,sx:0,sy:0};
window.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  gsap.to(cur,{x:e.clientX,y:e.clientY,duration:.07});
  gsap.to(curR,{x:e.clientX,y:e.clientY,duration:.26});
});

/* Render loop */
const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  mouse.sx+=(mouse.x-mouse.sx)*.04;
  mouse.sy+=(mouse.y-mouse.sy)*.04;
  cam.position.x+=(mouse.sx*.2 -cam.position.x)*.045;
  cam.position.y+=(mouse.sy*.13-cam.position.y)*.045;
  bgMat.uniforms.uTime.value=t;
  film.uniforms.uTime.value=t;
  stars.rotation.y=t*.006; stars.rotation.x=t*.0022;
  dust.rotation.y=-t*.011; dust.rotation.z=t*.007;
  composer.render();
})();

window.addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

/* ── Loader ── */
const lf=document.getElementById('lf'), ll=document.getElementById('ll'), loader=document.getElementById('loader');
const msgs=['Initializing…','Loading assets…','Building scene…','Almost ready…'];
let pct=0, mi=0;
const loadTick=setInterval(()=>{
  pct+=Math.random()*22+7;
  if(pct>100)pct=100;
  lf.style.width=pct+'%';
  ll.textContent=msgs[Math.min(mi++,msgs.length-1)];
  if(pct>=100){
    clearInterval(loadTick);
    setTimeout(()=>{
      gsap.to(loader,{opacity:0,duration:.6,ease:'power2.inOut',onComplete:()=>{loader.style.display='none'; intro();}});
    },300);
  }
},180);

/* ── Intro animation ── */
function intro(){
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl
    .to('#nav',   {opacity:1,duration:.7},0)
    .to('#bot',   {opacity:1,duration:.7},.1)
    .fromTo('#eyebrow', {opacity:0,y:14},{opacity:1,y:0,duration:.75},.35)
    .fromTo('#heroLogo',{opacity:0,y:44,scale:.94},{opacity:1,y:0,scale:1,duration:1.1,ease:'power4.out'},.52)
    .fromTo('#tagline', {opacity:0,y:12},{opacity:1,y:0,duration:.75},.9)
    .fromTo('#sep',     {opacity:0,scaleY:0},{opacity:1,scaleY:1,duration:.6,transformOrigin:'top'},1.1)
    .fromTo('#badge',   {opacity:0,y:8}, {opacity:1,y:0,duration:.6},1.28)
    .fromTo('#heroForm',{opacity:0,y:8}, {opacity:1,y:0,duration:.6},1.46);
}
</script>

<script>
function handleSubmit(e){
  e.preventDefault();
  const btn=e.target.querySelector('.hero-btn');
  btn.textContent='✓ You\'re on the list!';
  btn.style.background='#00cc77';
  btn.style.borderColor='#00cc77';
  e.target.querySelector('.hero-input').value='';
  setTimeout(()=>{btn.textContent='Notify Me';btn.style.background='';btn.style.borderColor='';},3500);
}
</script>
</body>
</html>
